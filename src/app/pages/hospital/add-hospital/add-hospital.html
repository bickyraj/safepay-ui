<div class="min-h-screen bg-slate-50">


  <!-- Page Header -->

  <div class="mb-6">

    <h1 class="text-2xl font-bold text-slate-800">
      Add New Hospital
    </h1>

    <p class="mt-1 text-sm text-slate-500">
      Create a new hospital account for your healthcare platform
    </p>

  </div>





  <!-- Form Card -->

  <form [formGroup]="hospitalForm" class="max-w-4xl rounded border border-slate-200 bg-white p-8">


    <!-- Header -->

    <div class="mb-8 flex items-center gap-4 border-b border-slate-200 pb-6">


      <div
        class="flex h-12 w-12 items-center justify-center rounded bg-gradient-to-br from-blue-600 to-cyan-500 text-white">

        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.8"
             stroke="currentColor"
             class="h-6 w-6">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a8.25 8.25 0 0 1 15 0"/>

        </svg>

      </div>



      <div>

        <h2 class="text-lg font-semibold text-slate-800">
          Hospital Information
        </h2>

        <p class="text-sm text-slate-500">
          Enter the details below to create an account
        </p>

      </div>


    </div>








    <!-- Form -->


    <div class="grid gap-6 md:grid-cols-2">



      <!-- First Name -->

      <div>

        <label class="mb-2 block text-sm font-medium text-slate-700">
          Name
        </label>


        <input
          formControlName="name"
          type="text"
          placeholder="Enter hospital name"
          class="h-10 w-full rounded border border-slate-300 px-3 text-sm outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500">

        @if (
          hospitalForm.controls['name'].hasError('required') &&
          hospitalForm.controls['name'].dirty
          ) {
          <div class="mt-1 text-red-500">This field is required.</div>
        }
      </div>

      <!-- Address -->

      <div>

        <label class="mb-2 block text-sm font-medium text-slate-700">
          Address
        </label>


        <input
          formControlName="address"
          type="text"
          placeholder="Enter hospital address"
          class="h-10 w-full rounded border border-slate-300 px-3 text-sm outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
      </div>

      <!-- Phone -->

      <div>

        <label class="mb-2 block text-sm font-medium text-slate-700">
          Phone Number
        </label>


        <input
          formControlName="phone"
          type="text"
          placeholder="+49 123 456789"
          class="h-10 w-full rounded border border-slate-300 px-3 text-sm outline-none transition focus:border-blue-500 focus:ring-1 focus:ring-blue-500">

      </div>
    </div>

    <!-- Actions -->


    <div class="mt-8 flex justify-end gap-3 border-t border-slate-200 pt-6">


      <button
        routerLink="/admin/hospitals"
        class="h-9 rounded border border-slate-200 px-4 text-sm font-medium text-slate-700 hover:bg-slate-50">

        Cancel

      </button>





      <button
        (click)="submitForm()"
        class="inline-flex h-9 items-center gap-2 rounded bg-blue-600 px-5 text-sm font-semibold text-white hover:opacity-90">


        Submit


      </button>


    </div>


  </form>


</div>
