<div class="flex flex-col min-h-screen">
  <!-- Header -->
  <div class="flex mb-5 place-content-between">
    <div class="">
      <h1 class="text-2xl font-bold text-gray-800 capitalize">Doctors</h1>
      <p class="text-gray-500 mt-1">
        Select a module to manage hospital resources.
      </p>
    </div>
    <button
      (click)="addDoctor()"
      class="inline-flex h-9 items-center gap-2 rounded bg-blue-600 px-3.5 text-sm font-semibold text-white transition hover:opacity-90"
    >
      <span>+ Add New Doctor</span>
    </button>
  </div>
  <app-mx-table
    [columns]="columns"
    [dataList]="dataList()"
    [paginationDetails]="paginationDetails()"
    (pageChange)="loadPage($event)"
  />
</div>
